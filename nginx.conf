# Anything not in this map returns a 404, preventing other queries being sent
map $arg_metric $prom_query {
    default       "";
    targets_up    "sum(up{origin=\"homelab\"})";
    node_cpu      "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\",origin=\"homelab\"}[5m])) * 100)";
    node_mem      "(1 - (node_memory_MemAvailable_bytes{origin=\"homelab\"} / node_memory_MemTotal_bytes{origin=\"homelab\"})) * 100";
    node_fs_root  "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\",origin=\"homelab\"} / node_filesystem_size_bytes{mountpoint=\"/\",origin=\"homelab\"}) * 100)";
}

# Rate limit by IP address
limit_req_zone $binary_remote_addr zone=promq:10m rate=2r/s;

server {
    listen 8080;
    server_name  _;

    # Resolve backend hostnames at request time via cluster DNS
    resolver 10.128.0.10 valid=10s ipv6=off;

    root  /usr/share/nginx/html;
    index index.html;

    # Path-only Location headers
    absolute_redirect off;
    port_in_redirect  off;

    # Serves /projects/personal-website/ from that dir's index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # Read-only Prometheus proxy for the home lab metrics cards
    location = /prom/query {
        if ($prom_query = "") { return 404; }

        limit_except GET { deny all; }
        limit_req zone=promq burst=5 nodelay;

        # POST so PromQL goes in the body
        proxy_method       POST;
        proxy_set_header   Content-Type "application/x-www-form-urlencoded";
        proxy_set_body     "query=$prom_query";

        # ClusterIP Service name in a variable
        set $prom_host "kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local";
        proxy_pass http://$prom_host:9090/api/v1/query?;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-store" always;
    }

    # K8s liveness probe. Deliberately does not touch the Prometheus upstream
    location = /livez {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Readiness probe. Gates Service endpoints and the rolling update.
    location = /readyz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
