# No http block required as it is included in the base image's nginx.conf

# Rate limit by IP address
limit_req_zone $binary_remote_addr zone=promq:10m rate=2r/s;

server {
    listen 8080;
    server_name  _;

    # Resolve backend hostnames at request time via cluster DNS
    resolver 10.128.0.10 valid=10s ipv6=off;

    root  /usr/share/nginx/html;
    index index.html;

    # Path-only Location headers
    absolute_redirect off;
    port_in_redirect  off;

    # Serves /projects/personal-website/ from that dir's index.html
    location / {
        try_files $uri $uri/ =404;
    }

    location = /summary {
        limit_except GET { deny all; }
        limit_req zone=promq burst=5 nodelay;
        limit_req_status 429;

        # ClusterIP Service name in a variable
        set $api_host "homelab-api.monitoring.svc.cluster.local";
        proxy_pass http://$api_host:8000/summary;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-store" always;
    }

    # K8s liveness probe. 
    location = /livez {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Readiness probe. Gates Service endpoints and the rolling update.
    location = /readyz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
