# Anything not in this map returns a 404, preventing other queries being sent
map $arg_metric $prom_query {
    default       "";
    targets_up    "sum(up{origin=\"homelab\"})";
    node_cpu      "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\",origin=\"homelab\"}[5m])) * 100)";
    node_mem      "(1 - (node_memory_MemAvailable_bytes{origin=\"homelab\"} / node_memory_MemTotal_bytes{origin=\"homelab\"})) * 100";
    node_fs_root  "100 - ((node_filesystem_avail_bytes{mountpoint=\"/\",origin=\"homelab\"} / node_filesystem_size_bytes{mountpoint=\"/\",origin=\"homelab\"}) * 100)";
}

# Rate limit by IP address
limit_req_zone $binary_remote_addr zone=promq:10m rate=2r/s;

# Named upstream so the address resolves once at startup. This must be the
# ClusterIP Service, not prometheus-operated: that one is headless and returns
# pod IPs, which go stale the first time a Prometheus pod restarts.
# Confirm the real name with: kubectl -n monitoring get svc
upstream prometheus {
    server kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090;
    keepalive 4;
}

server {
    listen 8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Path-only Location headers. Without this, the trailing-slash 301 is
    # built from the Host header and can emit http:// or an internal port
    # when TLS is terminated upstream at a NodeBalancer or ingress.
    absolute_redirect off;
    port_in_redirect  off;

    # Serves /projects/personal-website/ from that dir's index.html,
    # and 301s the slashless form onto it.
    location / {
        try_files $uri $uri/ =404;
    }

    # Read-only Prometheus proxy for the home lab metrics cards. Prometheus
    # stays ClusterIP-only; this is the only path to it from outside.
    location = /prom/query {
        if ($prom_query = "") { return 404; }

        limit_except GET { deny all; }
        limit_req zone=promq burst=5 nodelay;

        # POST so the PromQL rides in the body. Substituted into the request
        # line it would carry spaces and quotes and be an invalid URI.
        proxy_method       POST;
        proxy_set_header   Content-Type "application/x-www-form-urlencoded";
        proxy_set_body     "query=$prom_query";

        # Trailing "?" drops the client's own args so only the body is read.
        proxy_pass         http://prometheus/api/v1/query?;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;

        # add_header in a location replaces the server-level set rather than
        # extending it, so the security headers are repeated here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-store" always;
    }

    # K8s liveness probe. Deliberately does not touch the Prometheus
    # upstream — a home lab outage must not restart pods.
    location = /livez {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Readiness probe. Gates Service endpoints and the rolling update.
    location = /readyz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
