name: Build and deploy to Linode Kubernetes

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Ensures that a broken deploy doesn't leave the cluster in a half-deployed state.
concurrency:
  group: lke-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/swidjaja6/personal-website
  NAMESPACE: labsite
  DEPLOYMENT: site-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # LKE nodes are amd64; pinning avoids a surprise if the runner changes.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rewrites the tag in the runner's checkout only. Doing this before apply means one rollout instead of two
      - name: Point manifest at the image just built
        run: |
          sed -i "s#image: ${IMAGE}:.*#image: ${IMAGE}:${GITHUB_SHA}#" k8s/01-deployment.yaml
          grep -n "image:" k8s/01-deployment.yaml

      - uses: azure/setup-kubectl@v4
        with:
          # Keep within one minor version of the cluster.
          version: v1.31.0

      - name: Configure kubectl
        # Decodes kubeconfig from Github secrets and writes it into the runner's home directory
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -f k8s/

      # maxUnavailable:0 means a new pod that never passes its readiness probe stalls here and fails the run, 
      # while the old pods keep serving. Without this step a broken deploy reports as working.
      - name: Wait for rollout
        run: kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=180s

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide
          kubectl -n "$NAMESPACE" describe deployment "$DEPLOYMENT" | tail -40
          kubectl -n "$NAMESPACE" logs -l app=website --tail=50 --all-containers || true
